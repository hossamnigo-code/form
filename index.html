<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curated Finds | Secure Shop</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #adminPanel { transition: transform 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <header class="bg-white border-b border-gray-200 py-6 text-center sticky top-0 z-40 shadow-xs flex justify-between items-center px-6">
        <div class="w-20"></div> <div>
            <h1 class="text-2xl font-bold tracking-wide uppercase text-gray-800">Curated Finds</h1>
            <p class="text-xs text-gray-500 mt-1">Handpicked gear & essentials from Amazon</p>
        </div>
        <button onclick="toggleAdminPanel()" class="text-xs text-gray-400 hover:text-gray-600 border border-gray-200 px-3 py-1 rounded-md">Admin</button>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p id="loading" class="text-center col-span-full text-gray-400 py-12 text-sm">Loading curated collection...</p>
        </div>
    </main>

    <div id="adminPanel" class="fixed top-0 right-0 h-full w-80 bg-white shadow-2xl z-50 p-6 transform translate-x-full border-l border-gray-200 overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-gray-800">Shop Control</h2>
            <button onclick="toggleAdminPanel()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
        </div>
        
        <div id="loginForm" class="space-y-4">
            <p class="text-xs text-gray-500">Log in with your Supabase credentials to manage inventory.</p>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase">Email</label>
                <input type="email" id="adminEmail" class="w-full mt-1 p-2 border rounded-md text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase">Password</label>
                <input type="password" id="adminPassword" class="w-full mt-1 p-2 border rounded-md text-sm">
            </div>
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2 rounded-md font-medium text-sm hover:bg-blue-700 transition">Sign In</button>
        </div>

        <div id="adminControls" class="space-y-4 hidden">
            <div class="flex justify-between items-center bg-green-50 p-2 rounded-md mb-4">
                <span class="text-xs text-green-700 font-medium">✓ Logged In Securely</span>
                <button onclick="handleLogout()" class="text-xs text-red-500 underline">Logout</button>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase">Product Name</label>
                <input type="text" id="prodTitle" class="w-full mt-1 p-2 border rounded-md text-sm" placeholder="e.g., Minimalist Desk Mat">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase">Image URL</label>
                <input type="text" id="prodImage" class="w-full mt-1 p-2 border rounded-md text-sm" placeholder="https://example.com/image.jpg">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase">Amazon Affiliate URL</label>
                <input type="text" id="prodLink" class="w-full mt-1 p-2 border rounded-md text-sm" placeholder="https://amzn.to/...">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase">Price Tag</label>
                <input type="text" id="prodPrice" class="w-full mt-1 p-2 border rounded-md text-sm" placeholder="e.g., $25">
            </div>
            <button onclick="addProduct()" class="w-full bg-black text-white py-2 rounded-md font-medium text-sm hover:bg-gray-800 transition">Add Product Global</button>
            
            <hr class="my-6 border-gray-200">
            <h3 class="text-sm font-bold text-gray-700 mb-3">Manage Live Products</h3>
            <div id="adminProductList" class="space-y-2"></div>
        </div>
    </div>

    <footer class="text-center py-8 text-xs text-gray-400 max-w-2xl mx-auto px-4">
        As an Amazon Associate, I earn from qualifying purchases.
    </footer>

    <script>
        const SUPABASE_URL = "https://bddvpmtzuedxclseyxqs.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkZHZwbXR6dWVkeGNsc2V5eHFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDM4NDcsImV4cCI6MjA5NTQ3OTg0N30.JXpWWk0SurmsJlHtXJY-QNYtLDYyTuE0LvLeSDXn9XQ";

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let products = [];

        // Check auth state on startup to keep user logged in if they refresh
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            updateUIForAuth(session);
            fetchProducts();
        });

        async function fetchProducts() {
            const { data, error } = await _supabase.from('products').select('*').order('created_at', { ascending: false });
            if (!error) { products = data; renderShop(); }
        }

        function renderShop() {
            const grid = document.getElementById('productGrid');
            const adminList = document.getElementById('adminProductList');
            
            if (!products || products.length === 0) {
                grid.innerHTML = `<p class="text-center col-span-full text-gray-400 py-12 text-sm">Shop is empty.</p>`;
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="bg-white rounded-xl overflow-hidden border border-gray-100 shadow-xs flex flex-col">
                    <img src="${p.image}" class="w-full aspect-square object-cover">
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="text-sm font-semibold text-gray-800 line-clamp-2">${p.title}</h3>
                            <p class="text-xs font-bold text-gray-500 mt-1">${p.price || ''}</p>
                        </div>
                        <a href="${p.link}" target="_blank" class="mt-4 block text-center bg-gray-900 text-white text-xs py-2 rounded-md">View on Amazon</a>
                    </div>
                </div>
            `).join('');

            adminList.innerHTML = products.map(p => `
                <div class="flex items-center justify-between p-2 bg-gray-50 rounded-md text-xs">
                    <span class="truncate w-48">${p.title}</span>
                    <button onclick="deleteProduct(${p.id})" class="text-red-500 font-bold">Delete</button>
                </div>
            `).join('');
        }

        // Auth Logic Handlers
        async function handleLogin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Login Failed: ' + error.message);
            } else {
                updateUIForAuth(data.session);
            }
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            updateUIForAuth(null);
        }

        function updateUIForAuth(session) {
            const loginForm = document.getElementById('loginForm');
            const adminControls = document.getElementById('adminControls');
            if (session) {
                loginForm.classList.add('hidden');
                adminControls.classList.remove('hidden');
            } else {
                loginForm.classList.remove('hidden');
                adminControls.classList.add('hidden');
            }
        }

        async function addProduct() {
            const title = document.getElementById('prodTitle').value;
            const image = document.getElementById('prodImage').value;
            const link = document.getElementById('prodLink').value;
            const price = document.getElementById('prodPrice').value;

            const { error } = await _supabase.from('products').insert([{ title, image, link, price }]);
            if (error) alert(error.message);
            else { fetchProducts(); }
        }

        async function deleteProduct(id) {
            const { error } = await _supabase.from('products').delete().eq('id', id);
            if (error) alert(error.message);
            else fetchProducts();
        }

        function toggleAdminPanel() {
            document.getElementById('adminPanel').classList.toggle('translate-x-full');
        }
    </script>
</body>
</html>
